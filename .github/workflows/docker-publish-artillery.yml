name: Publish Docker image for Artillery

on:
  workflow_dispatch:
    # this will override the latest image, so only trigger when you want to publish a new version
    inputs:
      COMMIT_SHA:
        description: 'Commit SHA'
        required: true
        type: string
  workflow_call:
    inputs:
      COMMIT_SHA:
        description: 'Commit SHA'
        required: true
        type: string
    secrets:
      DOCKER_USERNAME:
        description: 'Docker Hub username'
        required: true
      DOCKER_PASSWORD:
        description: 'Docker Hub password'
        required: true

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.COMMIT_SHA || null }}
          fetch-depth: 0

      - name: Get Artillery version
        run: |
          echo "ARTILLERY_VERSION=$(node -e 'console.log(require("./packages/artillery/package.json").version)')" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
        with:
          images: artilleryio/artillery
          tags: |
            type=semver,pattern={{version}},value=${{env.ARTILLERY_VERSION}}
            type=raw,value=latest

      - name: Build release candidate Docker image
        uses: useblacksmith/build-push-action@v2
        with:
          context: ./packages/artillery
          load: true
          tags: artilleryio/artillery:release-candidate
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test Playwright imports from user code
        run: |
          docker run --rm \
            --entrypoint node \
            --workdir /tmp \
            --mount type=bind,source="$PWD/.github/workflows/scripts/smoke-test-artillery-docker-image.mjs",target=/tmp/smoke-test.mjs,readonly \
            artilleryio/artillery:release-candidate \
            /tmp/smoke-test.mjs

      - name: Publish Docker image
        env:
          DOCKER_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag artilleryio/artillery:release-candidate "$tag"
            docker push "$tag"
          done <<< "$DOCKER_TAGS"
